# 发布流水线：唯一发布路径 = push 规范版本 tag（vX.Y.Z 或 vX.Y.Z-prerelease）。
# 不依赖任何长期 NPM_TOKEN：发布凭证来自 GitHub Actions OIDC（npm Trusted Publishing），
# 由 npmjs.com 上登记的 Trusted Publisher（owner/repo/workflow 文件名/environment）授权。
# 首次使用前的人工配置步骤见 docs/release.md（必读）。
name: Release to npm

on:
  push:
    tags:
      - 'v*'            # 规范版本 tag：v0.2.0、v1.0.0-rc.1 等
  workflow_dispatch:    # 仅用于无副作用演练；dry_run 恒为 true，永不发布
    inputs:
      dry_run:
        description: 'Rehearse checks only (publish steps are skipped)'
        type: boolean
        default: true

permissions:
  contents: read        # 全局最小权限；id-token 仅在发布 job 内声明

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false   # 同一 tag 的重复触发必须排队，绝不并发发布

jobs:
  release:
    # tag push = 正式发布；workflow_dispatch = 仅演练（只在 dry_run=true 时执行）
    if: github.event_name == 'push' || inputs.dry_run == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # 创建 GitHub Release 所需；npm 发布凭证仅来自 id-token
      id-token: write   # OIDC：npm Trusted Publishing 与 provenance 的唯一凭证来源
    environment: release   # 须与 npmjs.com Trusted Publisher 登记的 environment 一致
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22          # 对齐 dshhub compatibility.node (>=22)
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      # Node 22 自带的 npm 10.x 不支持 Trusted Publishing，必须升级并断言版本。
      # 整条流水线不设置 NODE_AUTH_TOKEN：npm >= 11.5 在 GitHub Actions 内检测到
      # id-token: write 且无有效 token 时，自动用 OIDC 身份完成发布。
      - name: Upgrade npm for Trusted Publishing (>= 11.5.1)
        run: |
          npm install -g npm@^11.5.1
          current="$(npm -v)"
          required="11.5.1"
          if [ "$(printf '%s\n' "$required" "$current" | sort -V | head -n1)" != "$required" ]; then
            echo "::error::npm >= ${required} required for Trusted Publishing, got ${current}"
            exit 1
          fi

      - name: Resolve release version from package.json
        run: echo "RELEASE_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          echo "tag=${GITHUB_REF_NAME} version=${RELEASE_VERSION}"
          if [ "$tag_version" != "$RELEASE_VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 package.json version ${RELEASE_VERSION} 不一致；请修正 tag 或版本号后重试"
            exit 1
          fi

      # 对标报告 §9 P0：CHANGELOG 每版本必有小节，缺失则拒绝发版。
      # 注意：本仓库 CHANGELOG.md 尚未建立，首次发布 v0.2.0 前必须先落地
      # CHANGELOG.md 并写入 ## 0.2.0 小节，否则此守卫会按设计拒绝发版。
      - name: Require CHANGELOG section for this version
        if: github.event_name == 'push'
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::缺少 CHANGELOG.md：发布要求每版本维护一个小节（对标 §9 P0）"
            exit 1
          fi
          notes="$(awk -v ver="$RELEASE_VERSION" '$0 == "## " ver { f = 1; next } /^## / && f { exit } f' CHANGELOG.md)"
          if [ -z "$notes" ]; then
            echo "::error::CHANGELOG.md 缺少 ## ${RELEASE_VERSION} 小节，请补充后再打 tag"
            exit 1
          fi

      # 明确失败而非跳过（与对标插件"已存在则跳过"的幂等策略是有意偏差）：
      # 任务合同要求对重复版本给出明确失败，避免错误复用旧 tag 时静默跳过发布。
      - name: Fail fast if version already published
        run: |
          if npm view "dsh-model-context-catalog@${RELEASE_VERSION}" version \
               --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "::error::dsh-model-context-catalog@${RELEASE_VERSION} 已存在于 npm；版本不可重发，请 bump 版本后重新打 tag"
            exit 1
          fi

      - name: Install (reproducible, lockfile-driven)
        run: npm ci

      - name: Build and syntax-check
        run: npm run check

      - name: Test
        run: npm test

      - name: Check package boundary (npm pack)
        run: |
          # --ignore-scripts：check/test 已在上面显式执行，这里跳过 prepack 以保证 stdout 是纯 JSON
          npm pack --dry-run --json --ignore-scripts > "$RUNNER_TEMP/pack.json"
          node -e '
            const fs = require("node:fs");
            // 容错：跳过可能混入 stdout 的前置行，从 JSON 数组起点开始解析
            let raw = fs.readFileSync(process.env.RUNNER_TEMP + "/pack.json", "utf8");
            raw = raw.slice(raw.indexOf("["));
            const report = JSON.parse(raw)[0];
            const files = report.files.map((f) => f.path);
            console.log(files.join("\n"));
            const required = [
              "package.json",
              "README.md",
              "LICENSE",
              "ROOT_CAUSE.md",
              "CONTRIBUTING.md",
              "cordis.patch.yml",
              "lib/index.js",
              "lib/catalog.js",
              "lib/client.js",
            ];
            const missing = required.filter((f) => !files.includes(f));
            if (missing.length > 0) {
              console.error("::error::tarball 缺少文件: " + missing.join(", "));
              process.exit(1);
            }
            const forbidden = files.filter((f) =>
              f.startsWith("node_modules/") ||
              f.startsWith(".github/") ||
              f.startsWith("test/") ||
              f.startsWith("scripts/") ||
              f.includes(".env")
            );
            if (forbidden.length > 0) {
              console.error("::error::tarball 含不应发布的文件: " + forbidden.join(", "));
              process.exit(1);
            }
            console.log("package boundary OK: " + files.length + " files");
          '

      # 唯一发布动作：无 token 时由 npm 使用本 workflow 的 OIDC 身份完成 Trusted
      # Publishing。prerelease（版本含 "-"）发布到 dist-tag next，稳定版进入 latest。
      - name: Publish to npm via Trusted Publishing (OIDC)
        if: github.event_name == 'push'
        run: |
          dist_tag_args=""
          case "$RELEASE_VERSION" in
            *-*) dist_tag_args="--tag next" ;;
          esac
          npm publish --provenance $dist_tag_args

      - name: Verify published package and provenance
        if: github.event_name == 'push'
        run: |
          for attempt in 1 2 3 4 5 6; do
            if npm view "dsh-model-context-catalog@${RELEASE_VERSION}" \
                 version dist-tags dist.attestations --json; then
              exit 0
            fi
            echo "attempt ${attempt}: registry 尚未返回该版本，5 秒后重试..."
            sleep 5
          done
          echo "::error::发布后无法在 registry 上查询到该版本"
          exit 1

      # 幂等：Release 已存在则跳过（对标 §7.1）；Notes 取自 CHANGELOG 对应小节
      # （该小节此时已被前面的守卫确认存在）。
      - name: Create GitHub Release (idempotent)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub Release ${GITHUB_REF_NAME} 已存在，跳过"
            exit 0
          fi
          awk -v ver="$RELEASE_VERSION" \
            '$0 == "## " ver { f = 1; next } /^## / && f { exit } f' \
            CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" \
            --title "v${RELEASE_VERSION}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
